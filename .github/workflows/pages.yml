name: Publish ECHO on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Verify the game opens in headless Chrome
        run: |
          node server.mjs >/tmp/echo-server.log 2>&1 &
          echo_server_pid=$!
          trap 'kill "$echo_server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health >/dev/null; then break; fi
            sleep 0.2
          done
          timeout 90s google-chrome --headless --no-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-dev-shm-usage --virtual-time-budget=1500 --dump-dom http://localhost:3001/ >/tmp/echo-dom.html 2>/tmp/echo-chrome.log
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const html=readFileSync('/tmp/echo-dom.html','utf8'); if(!html.includes('data-game-ready=\"true\"')) { console.error(html.slice(-6000)); process.exit(1); } console.log('Browser rendered first game frame successfully');"
      - name: Prepare the same entry point for both Pages publishing modes
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R dist _site/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publish
        uses: actions/deploy-pages@v4
